# Scenario 1 — CrashLoopBackOff
# The container starts and immediately crashes because it looks for a required
# environment variable (DATABASE_URL) that is not provided.
#
# Expected AI diagnosis:
#   Root Cause : Missing environment variable causing application startup failure
#   Suggested Fix: Add DATABASE_URL to the deployment env (via Secret/ConfigMap)
#
# Apply:   kubectl apply -f scenario-1-crashloopbackoff.yaml
# Cleanup: kubectl delete -f scenario-1-crashloopbackoff.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash-demo
  template:
    metadata:
      labels:
        app: crash-demo
    spec:
      containers:
        - name: crash-demo
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: required env variable DATABASE_URL is not set" >&2
                exit 1
              fi
              echo "Connected to $DATABASE_URL"
              sleep 3600
